name: Control CI

on:
  push:
    paths-ignore:
      - '**/*.md'
  pull_request:
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Build Linux control plane
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/boostlab-control-linux-amd64 ./cmd/control
      - name: Build Windows control plane
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o dist/boostlab-control-windows-amd64.exe ./cmd/control
      - name: Upload control plane builds
        uses: actions/upload-artifact@v4
        with:
          name: boostlab-control-binaries
          path: |
            dist/boostlab-control-linux-amd64
            dist/boostlab-control-windows-amd64.exe
          if-no-files-found: error
          retention-days: 14
